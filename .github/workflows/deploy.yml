name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Assets are referenced relatively (see vite.config.ts), so one build
      # serves from github.io/<repo>/ and from any CDN mirror of this branch.
      - run: npm run build

      - name: SPA fallback and Jekyll opt-out
        # Pages has no rewrite rules, so 404.html covers deep links once
        # client-side routing arrives. .nojekyll stops Pages stripping files.
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      # Mirror the build to a branch. Not what serves the site — it's a durable,
      # always-current artifact that can be pointed at another host in minutes
      # if Pages misbehaves again, without waiting on a rebuild.
      - name: Mirror to gh-pages
        run: |
          cd dist
          git init -q -b gh-pages
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Build ${GITHUB_SHA::7}"
          git push -qf \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            gh-pages:gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Publish through the Actions pipeline rather than the legacy branch
      # builder. Both have failed today, but in different ways: the legacy
      # builder errors out with a generic "Page build failed" after 10-15
      # minutes and has done so on every attempt for hours, while this path
      # succeeded twice this morning and only failed when the deployment queue
      # ran past the action's hard-capped 10 minute timeout.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
