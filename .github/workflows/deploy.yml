name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Assets are referenced relatively (see vite.config.ts), so one build
      # serves from github.io/<repo>/ and from any CDN mirror of this branch.
      - run: npm run build

      - name: SPA fallback and Jekyll opt-out
        # Pages has no rewrite rules, so 404.html covers deep links once
        # client-side routing arrives. .nojekyll stops Pages stripping files.
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      # Publish by pushing the build to a branch rather than using
      # actions/deploy-pages.
      #
      # That action polls the Pages deployment API and aborts if the deployment
      # hasn't completed, with the timeout hard-capped at 10 minutes
      # (MAX_TIMEOUT in its source — the `timeout` input is silently clamped to
      # it via Math.min, so raising it does nothing). Pages deployments for this
      # repo have been sitting in `queued` past that limit, so every run failed
      # on backend latency despite a clean build.
      #
      # Pushing to a branch makes publishing asynchronous: the workflow's job is
      # done once the commit lands, and Pages picks it up whenever it gets to
      # it. A slow queue then delays the site instead of failing the build.
      - name: Publish to gh-pages
        run: |
          cd dist
          git init -q -b gh-pages
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Deploy ${GITHUB_SHA::7}"
          git push -qf \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            gh-pages:gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
